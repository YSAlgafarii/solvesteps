<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#0f1220;color:#e8eaf2;min-height:100vh;padding:16px}

<script>
function tab(t){
 document.getElementById('tabMath').classList.toggle('on',t=='math');
 document.getElementById('tabPhy').classList.toggle('on',t=='phy');
 document.getElementById('tabQuiz').classList.toggle('on',t=='quiz');
 document.getElementById('mathPane').style.display=t=='math'?'block':'none';
 document.getElementById('phyPane').style.display=t=='phy'?'block':'none';
 document.getElementById('quizPane').style.display=t=='quiz'?'block':'none';
 if(t=='quiz')showStreak();
}
function eg(){document.getElementById('mIn').value='(6y + x)(6y - x)';solveMath();}
function sq(s){return s.replace(/\^2/g,'<sup>2</sup>');}
function steps(arr,ans){
 var h='';
 arr.forEach(function(s,i){h+='<div class="step"><div class="n">'+(i+1)+'</div><div><div class="expr">'+sq(s[0])+'</div><div class="rule">'+s[1]+'</div></div></div>';});
 if(ans)h+='<div class="ans"><div class="expr">'+sq(ans[0])+'</div><div class="rule">'+ans[1]+'</div></div>';
 document.getElementById('out').innerHTML='<div class="card">'+h+'</div>';
 addSimilar();
}
function strip(s){return s.replace(/\s+/g,'').replace(/\u2212/g,'-');}
function solveMath(){
 var raw=strip(document.getElementById('mIn').value);
 if(!raw)return;
 try{
  var ex=tryExplain(document.getElementById('mIn').value);if(ex){document.getElementById('out').innerHTML=ex;return;}
  var ph=phyFromText(document.getElementById('mIn').value);
  if(ph){return renderPhyResult(ph.p,ph.vals);}
  if(/%/.test(raw))return solvePercent(raw);
  if(/^[\d+\-*\/\.() ]+$/.test(raw))return solveArith(raw);
  if(raw.indexOf('=')>-1)return solveEq(raw);
  if(raw.indexOf(')(')>-1)return expand(raw);
  return simplify(raw);
 }catch(e){document.getElementById('out').innerHTML='<div class="card">could not parse that one yet - try the example format</div>';}
}
// 20% of 840, or 20%840, or plain arithmetic like 12*8+5
function solvePercent(raw){
 var m=raw.match(/^([\d.]+)%\s*of\s*([\d.]+)$/)||raw.match(/^([\d.]+)%([\d.]+)$/);
 if(!m)throw 0;
 var p=parseFloat(m[1]),n=parseFloat(m[2]);
 var frac=p/100,ans=frac*n;
 steps([
  [raw+'','start: '+p+'% of '+n],
  [p+'% = '+p+' \u00f7 100 = '+frac,'a percent is just a fraction out of 100'],
  [p+'% \u00d7 '+n+' = '+frac+' \u00d7 '+n,'\u201cof\u201d means multiply'],
  [frac+' \u00d7 '+n+' = '+ans,'do the multiplication']
 ],[ans+'   \u2713',p+'% of '+n]);
}
function solveArith(raw){
 if(!/^[\d+\-*\/\.() ]+$/.test(raw))throw 0;
 // tokenise numbers and operators for step display
 var toks=raw.match(/\d+\.?\d*|[+\-*\/()]/g);
 var val;
 try{val=Function('return ('+raw+')')();}catch(e){throw 0;}
 if(!isFinite(val))throw 0;
 var S=[[raw+'','start: follow BODMAS (brackets, of, division, multiplication, addition, subtraction)']];
 // show multiplication/division first if present
 var hasMD=/[\*\/]/.test(raw),hasB=/\(/.test(raw);
 if(hasB)S.push(['resolve the brackets first','BODMAS: anything inside brackets comes first']);
 if(hasMD)S.push([toks.join(' '),'do all \u00d7 and \u00f7 before + and -']);
 S.push(['= '+Number(val.toFixed(10)),'finish with addition and subtraction, left to right']);
 steps(S,[Number(val.toFixed(10))+'   \u2713','final answer']);
}
function terms(s){
 return s.replace(/-/g,'+-').split('+').filter(function(x){return x!=='';}).map(function(x){return x.trim();});
}
function parseTerm(t){
 var k=1,v='';var m=t.match(/^(-?\d*\.?\d*)(.*)$/);
 if(m[1]!==''&&m[1]!=='-')k=parseFloat(m[1]);else if(m[1]==='-')k=-1;
 v=m[2]||'';
 return{k:k,v:v};
}
function mulName(a,b){
 var pa=parseTerm(a),pb=parseTerm(b);
 var k=pa.k*pb.k;var v='';
 if(pa.v===pb.v&&pa.v!=='')v=pa.v+'^2';else v=(pa.v+pb.v).split('').sort().join('');
 return {k:k,v:v};
}
function expand(raw){
 var m=raw.match(/^\(([^()]+)\)\(([^()]+)\)$/);
 if(!m)throw 0;
 var e1=m[1],e2=m[2];
 var p1=terms(e1),p2=terms(e2);
 var S=[[raw,'start: two brackets multiply each other']];
 var prods=[];
 p1.forEach(function(a){p2.forEach(function(b){prods.push([a,b]);});});
 var line=prods.map(function(p){var r=mulName(p[0],p[1]);return (r.k===1?'':r.k===-1?'-':r.k)+r.v;}).join(' + ');
 S.push([line,'multiply every term in the first bracket by every term in the second (FOIL)']);
 var comb={},plain=[],order=[];
 prods.forEach(function(p){
  var r=mulName(p[0],p[1]);
  if(r.v===''){plain.push(r.k);}
  else{if(!(r.v in comb)){comb[r.v]=0;order.push(r.v);}comb[r.v]+=r.k;}
 });
 var parts=[];
 if(plain.length)parts.push(plain.join(' + '));
 order.forEach(function(v){
  var c=comb[v];
  if(c===0)return;
  parts.push((c===1?'':c===-1?'-':c)+v);
 });
 S.push([parts.join(' + '),'collect like terms (same variable parts add together)']);
 var clean=parts.join(' + ').replace(/\+ -/g,'- ');
 var ruleMsg='final answer';
 if(/\^2/.test(clean)&&parts.length===2&&clean.indexOf('+ -')<0&&clean.indexOf(' - ')<0===false){ruleMsg='final answer';}
 steps(S,[clean+'   \u2713',ruleMsg]);
}
function coef(v){return v===1?'':v===-1?'-':v;}
function showP(v){return v<0?' - '+Math.abs(v):' + '+v;}
function solveEq(raw){
 var parts=raw.split('=');if(parts.length!==2)throw 0;
 var L=parts[0],R=parts[1];
 var S=[[raw,'start: the equation']];
 var moved=L;
 if(R!=='0'){
  var rt=terms(R);
  moved=L+rt.map(function(t){return '-'+t;}).join('');
  S.push([moved+' = 0','move everything to one side: subtract ('+R+') from both sides']);
 }
 var tt=terms(moved.replace(/^0\+?/,''));
 var a=0,b=0,c=0,hasX=false;
 tt.forEach(function(t){
  var m=t.match(/^(-?\d*\.?\d*)(x(\^2)?)$/);
  if(m){hasX=true;
   var k=(m[1]===''||m[1]==='-')?(m[1]==='-'?-1:1):parseFloat(m[1]);
   if(m[3])a+=k;else b+=k;
  }else{c+=parseFloat(t);}
 });
 if(!hasX)throw 0;
 if(a===0){
  S.push([coef(b)+'x'+showP(c)+' = 0','linear form: keep only the x term on one side']);
  S.push([coef(b)+'x = '+(-c),'subtract '+c+' from both sides']);
  S.push(['x = '+(-c)+' \u00f7 '+b,'divide both sides by '+b]);
  steps(S,['x = '+Number(((-c)/b).toFixed(6)),'final answer']);
  return;
 }
 S.push([coef(a)+'x^2'+showP(b)+'x'+showP(c)+' = 0','standard form: ax^2 + bx + c = 0  (a='+a+', b='+b+', c='+c+')']);
 var d=b*b-4*a*c;
 S.push(['D = b^2 - 4ac = ('+b+')^2 - 4('+a+')('+c+') = '+d,'discriminant: tells us the type of roots']);
 if(d<0){steps(S,['no real solution','D < 0 means the curve never touches the x-axis']);return;}
 S.push(['x = (-b \u00b1 \u221aD) / 2a','quadratic formula']);
 var r=Math.sqrt(d);
 var x1=(-b+r)/(2*a),x2=(-b-r)/(2*a);
 if(d===0){steps(S,['x = '+Number(x1.toFixed(6)),'one repeated root']);return;}
 steps(S,['x = '+Number(x1.toFixed(6))+'   or   x = '+Number(x2.toFixed(6)),'two roots (+ and -)']);
}
function simplify(raw){
 var t=terms(raw);
 var S=[[raw,'start: simplify the expression']];
 var a=0,b=0,c=0,hasX=false;
 t.forEach(function(x){
  var m=x.match(/^(-?\d*\.?\d*)(x(\^2)?)$/);
  if(m){hasX=true;
   var k=(m[1]===''||m[1]==='-')?(m[1]==='-'?-1:1):parseFloat(m[1]);
   if(m[3])a+=k;else b+=k;
  }else if(!isNaN(parseFloat(x)))c+=parseFloat(x);else throw 0;
 });
 var out=[];
 if(a)out.push(coef(a)+'x^2');
 if(b)out.push(coef(b)+'x');
 if(c||out.length===0)out.push((c<0?'- ':'')+Math.abs(c));
 steps(S,[out.join(' + ').replace(/\+ -/g,'- '),'collect like terms: x^2 together, x together, numbers together']);
}
var PHY=[
 {n:'Speed',v:'speed',f:'v = d / t',inp:[['d','distance (m)'],['t','time (s)']],calc:function(i){var r=i.d/i.t;return[r,'v = '+i.d+' / '+i.t+' = '+r+' m/s'];}},
 {n:'Acceleration',v:'acc',f:'a = (v - u) / t',inp:[['v','final velocity (m/s)'],['u','initial velocity (m/s)'],['t','time (s)']],calc:function(i){var r=(i.v-i.u)/i.t;return[r,'a = ('+i.v+' - '+i.u+') / '+i.t+' = '+r+' m/s\u00b2'];}},
 {n:'Force (F = ma)',v:'force',f:'F = m \u00d7 a',inp:[['m','mass (kg)'],['a','acceleration (m/s\u00b2)']],calc:function(i){var r=i.m*i.a;return[r,'F = '+i.m+' \u00d7 '+i.a+' = '+r+' N'];}},
 {n:'Work',v:'work',f:'W = F \u00d7 d',inp:[['f','force (N)'],['d','distance (m)']],calc:function(i){var r=i.f*i.d;return[r,'W = '+i.f+' \u00d7 '+i.d+' = '+r+' J'];}},
 {n:'Power',v:'power',f:'P = W / t',inp:[['w','work (J)'],['t','time (s)']],calc:function(i){var r=i.w/i.t;return[r,'P = '+i.w+' / '+i.t+' = '+r+' W'];}},
 {n:'Ohms law',v:'ohm',f:'V = I \u00d7 R',inp:[['i','current (A)'],['r','resistance (ohms)']],calc:function(i){var r=i.i*i.r;return[r,'V = '+i.i+' \u00d7 '+i.r+' = '+r+' V'];}}
];

// ---- natural-language physics: detect formula + values from one input ----
var PHYUNITS=[['m','kg|kilogram|kilogramme'],['a','m/s2|m/s\u00b2|acceleration|ms-2'],['d','m|meter|metre|km|cm|distance'],['t','s|sec|second|seconds|min|minutes|hour|hours'],['v','m/s|km/h|velocity|speed'],['u','m/s|km/h'],['f','n|newton|newtons|force'],['w','j|joule|joules|work'],['i','a|amp|ampere|current'],['r','ohm|ohms|resistance']];
function phyFromText(t){
  t=t.toLowerCase();
  var topic=null, kws={speed:['speed','velocity'],acc:['acceleration'],force:['force'],work:['work'],power:['power'],ohm:['ohm','voltage','current','resistance']};
  for(var k in kws){for(var j=0;j<kws[k].length;j++){if(t.indexOf(kws[k][j])>-1){topic=k;break;}}}
  if(!topic)return null;
  // grab "label = value" and "value unit" pairs
  function grab(re){var m=t.match(re);return m?parseFloat(m[1]):null;}
  var g={};
  g.d=grab(/(?:distance|d)\s*(?:=|is|of)?\s*([\d.]+)/)||grab(/([\d.]+)\s*(?:m|metre|meter|km|cm)\b/);
  g.t=grab(/(?:time|t)\s*(?:=|is)?\s*([\d.]+)/)||grab(/([\d.]+)\s*(?:s|sec|second|seconds|minutes|min|hours?)\b/);
  g.v=grab(/(?:final velocity|velocity|speed|v)\s*(?:=|is)?\s*([\d.]+)/)||grab(/([\d.]+)\s*m\/s\b/);
  g.u=grab(/(?:initial velocity|from|u)\s*(?:=|is)?\s*([\d.]+)/)||0;
  g.m=grab(/(?:mass|m)\s*(?:=|is)?\s*([\d.]+)/)||grab(/([\d.]+)\s*kg\b/);
  g.a=grab(/(?:acceleration|a)\s*(?:=|is)?\s*([\d.]+)/)||grab(/([\d.]+)\s*m\/s2|([\d.]+)\s*m\/s\u00b2/);
  g.f=grab(/(?:force|f)\s*(?:=|is)?\s*([\d.]+)/)||grab(/([\d.]+)\s*(?:n|newtons?)\b/);
  g.w=grab(/(?:work|w)\s*(?:=|is)?\s*([\d.]+)/)||grab(/([\d.]+)\s*(?:j|joules?)\b/);
  g.i=grab(/(?:current|i)\s*(?:=|is)?\s*([\d.]+)/)||grab(/([\d.]+)\s*(?:a|amp|ampere)\b/);
  g.r=grab(/(?:resistance|r)\s*(?:=|is)?\s*([\d.]+)/)||grab(/([\d.]+)\s*ohms?\b/);
  var need={speed:['d','t'],acc:['v','u','t'],force:['m','a'],work:['f','d'],power:['w','t'],ohm:['i','r']}[topic];
  for(var n=0;n<need.length;n++){if(g[need[n]]===null||isNaN(g[need[n]]))return null;}
  var p=PHY.filter(function(x){return x.v===topic;})[0], vals={},ok=true;
  need.forEach(function(x){vals[x]=g[x];});
  return {p:p,vals:vals};
}


function renderPhyResult(p,vals){
  var r=p.calc(vals);
  document.getElementById('out').innerHTML='<div class="card">'
   +'<div class="step"><div class="n">1</div><div><div class="expr">'+p.f+'</div><div class="rule">'+p.n+' - the formula</div></div></div>'
   +'<div class="step"><div class="n">2</div><div><div class="expr">'+r[1]+'</div><div class="rule">substitute the values</div></div></div>'
   +'</div><div class="ans"><div class="expr">'+r[0]+' \u2713</div><div class="rule">final answer</div></div>';
  addSimilar();
}

var curPhy=PHY[0];
function renderPhy(){
 document.getElementById('pGrid').innerHTML=PHY.map(function(p){return '<button class="'+(p.v===curPhy.v?'on':'')+'" onclick="pickPhy(\''+p.v+'\')">'+p.n+'</button>';}).join('');
 document.getElementById('pInputs').innerHTML='<label>'+curPhy.f+'</label>'+curPhy.inp.map(function(x){return '<input type="number" id="p_'+x[0]+'" placeholder="'+x[1]+'" step="any">';}).join('');
}
function pickPhy(v){curPhy=PHY.filter(function(p){return p.v===v;})[0];renderPhy();}
function solvePhy(){
 var i={},ok=true;
 curPhy.inp.forEach(function(x){var v=parseFloat(document.getElementById('p_'+x[0]).value);if(isNaN(v))ok=false;i[x[0]]=v;});
 if(!ok){document.getElementById('out').innerHTML='<div class="card">fill all the boxes first</div>';return;}
 var r=curPhy.calc(i);
 document.getElementById('out').innerHTML='<div class="card">'
  +'<div class="step"><div class="n">1</div><div><div class="expr">'+curPhy.f+'</div><div class="rule">the formula</div></div></div>'
  +'<div class="step"><div class="n">2</div><div><div class="expr">'+r[1]+'</div><div class="rule">substitute the values</div></div></div>'
  +'</div><div class="ans"><div class="expr">'+r[0]+' \u2713</div><div class="rule">final answer</div></div>';
}
function feedback(){
 var f=prompt('Wetin you wan tell us? (question, suggestion or issue)');
 if(f){
  var u='mailto:ayalgafarii@gmail.com?subject='+encodeURIComponent('SolveSteps feedback')+'&body='+encodeURIComponent(f+'\n\n-- sent from SolveSteps app');
  window.location.href=u;
 }
}
renderPhy();

// QUIZ + STREAKS
function todayStr(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function loadSave(){try{return JSON.parse(localStorage.getItem('ss_save')||'{}');}catch(e){return{};}}
function saveSave(o){localStorage.setItem('ss_save',JSON.stringify(o));}
function showStreak(){
 var sv=loadSave();
 var st=sv.streak||0,best=sv.best||0;
 var last=sv.lastDay||'';
 var yesterday=(function(){var d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();})();
 if(last===yesterday){/* streak still alive, will bump on first correct today */}
 var msg='<div class="expr">\ud83d\udd25 streak: '+st+' day'+(st===1?'':'s')+' &nbsp;|&nbsp; best: '+best+'</div>';
 msg+='<div class="rule">'+(last===todayStr()?'you don practice today - keep am going':'answer questions today to grow ur streak')+'</div>';
 document.getElementById('streakCard').innerHTML=msg;

function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function genQ(){
 var type=rnd(0,7),q,a,opts,expl;
 if(type===0){ // percent
  var p=rnd(1,9)*10,n=rnd(2,20)*10;
  q='What is '+p+'% of '+n+'?';
  a=p/100*n;
  expl=p+'% of '+n+' = '+(p/100)+' \u00d7 '+n+' = '+a;
 }else if(type===1){ // linear eq
  var m=rnd(2,9),x=rnd(1,12),c=rnd(1,30);
  q='Solve: '+m+'x + '+c+' = '+(m*x+c);
  a=x;
  expl=m+'x = '+(m*x)+' , x = '+x;
 }else if(type===2){ // arithmetic
  var v1=rnd(6,15),v2=rnd(3,12),v3=rnd(2,20);
  q=v1+' \u00d7 '+v2+' + '+v3+' = ?';
  a=v1*v2+v3;
  expl='BODMAS: '+v1+' \u00d7 '+v2+' = '+(v1*v2)+' , then + '+v3;
 }else if(type===4){ // indices (WAEC style)
  var b=rnd(2,4),e=rnd(2,4),f=rnd(1,2);
  q='Simplify: '+b+'^'+e+' \u00d7 '+b+'^'+f;
  a=Math.pow(b,e+f);
  expl='same base: add powers. '+b+'^'+e+' \u00d7 '+b+'^'+f+' = '+b+'^'+(e+f)+' = '+a;
 }else if(type===5){ // ratio
  var r1=rnd(2,5),r2=rnd(2,7),unit=rnd(2,12);
  q='Divide '+(r1+r2)*unit+' in the ratio '+r1+':'+r2+'. What is the larger share?';
  a=Math.max(r1,r2)*unit;
  expl='total parts = '+(r1+r2)+', one part = '+((r1+r2)*unit)+' \u00f7 '+(r1+r2)+' = '+unit+'. Larger share = '+Math.max(r1,r2)+' \u00d7 '+unit+' = '+a;
 }else if(type===6){ // physics F=ma (JAMB style)
  var m2=rnd(2,10),acc=rnd(2,10);
  q='A body of mass '+m2+' kg accelerates at '+acc+' m/s\u00b2. Find the force.';
  a=m2*acc;
  expl='F = ma = '+m2+' \u00d7 '+acc+' = '+a+' N';
 }else if(type===7){ // speed
  var d2=rnd(2,9)*10,h2=rnd(2,5);
  q='A car travels '+d2+' km in '+h2+' hours. Find the average speed.';
  a=d2/h2;
  expl='speed = distance \u00f7 time = '+d2+' \u00f7 '+h2+' = '+a+' km/h';
 }else{ // difference of two squares value
  var A=rnd(2,9),B=rnd(1,9);
  q='('+A+'y + '+B+'x)('+A+'y - '+B+'x) = ?';
  a=A*A; // coefficient of y^2
  opts=[a, (A+B), (A*B), (A+B+1)];
  return {q:q,a:a,opts:opts,expl:'difference of two squares: ('+A+'y)^2 - ('+B+'x)^2 = '+a+'y\u00b2 - '+(B*B)+'x\u00b2. y\u00b2 coefficient na '+a};
 }
 opts=[a,a+rnd(1,5),Math.max(0,a-rnd(1,5)),a+rnd(6,10)];
 // dedupe
 var seen={};opts=opts.map(function(o){return Math.round(o*1000)/1000;});
 return {q:q,a:a,opts:opts,expl:expl};
}
function newQuiz(){
 QZ={i:0,score:0,qs:[]};
 for(var i=0;i<5;i++)QZ.qs.push(genQ());
 renderQ();
}
function renderQ(){
 var q=QZ.qs[QZ.i];
 var opts=q.opts.slice().sort(function(){return Math.random()-0.5;});
 var h='<div class="card"><div class="expr">Question '+(QZ.i+1)+' of 5</div><div class="expr" style="margin:10px 0">'+sq(q.q)+'</div>';
 opts.forEach(function(o){
  h+='<button class="eg" style="text-align:left;margin-top:6px" onclick="answer('+o+')">'+o+'</button>';
 });
 h+='</div>';
 document.getElementById('quizArea').innerHTML=h;
}
function answer(v){
 var q=QZ.qs[QZ.i];
 var ok=(Math.abs(v-q.a)<0.001);
 if(ok)QZ.score++;
 document.getElementById('quizArea').innerHTML='<div class="card"><div class="expr">'+(ok?'\u2705 correct!':'\u274c wrong - answer na '+q.a)+'</div><div class="rule">'+q.expl+'</div></div>'
 +'<button class="go" onclick="nextQ()">'+(QZ.i<4?'Next question':'See result')+'</button>';
}
function nextQ(){
 QZ.i++;
 if(QZ.i<5){renderQ();return;}
 var sv=loadSave();
 var d=todayStr();
 if(sv.lastDay!==d){
  var y=new Date();y.setDate(y.getDate()-1);
  var ys=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
  sv.streak=(sv.lastDay===ys)?(sv.streak||0)+1:1;
  sv.lastDay=d;
  sv.best=Math.max(sv.best||0,sv.streak);
  saveSave(sv);
 }

 if(QZ.score>=4)msg+='<div class="rule">you too much! \ud83d\udd25 streak don update</div>';
 else if(QZ.score>=2)msg+='<div class="rule">solid - tomorrow go better</div>';
 else msg+='<div class="rule">no worry, check the steps tab make you learn the patterns</div>';
 msg+='</div>';
 document.getElementById('quizArea').innerHTML=msg;
}

var LAST_INPUT='';
function addSimilar(){
 LAST_INPUT=document.getElementById('mIn').value;
 var old=document.getElementById('similarBtn');if(old)old.remove();
 if(!LAST_INPUT)return;
 var b=document.createElement('button');
 b.id='similarBtn';b.className='go';b.style.background='#232848';
 b.textContent='🔁 Practice a similar question';
 b.onclick=similarQ;

function similarQ(){
 if(!LAST_INPUT)return;
 var t=LAST_INPUT, m;
 // linear equation ax+b=c -> generate variation
 if((m=t.match(/([-?\d.]+)\s*\*?\s*x\s*([+-]\s*[\d.]+)?\s*=\s*([\d.]+)/))||(m=t.match(/([-?\d.]+)x\s*([+-][\d.]+)?=([\d.]+)/))){
   var a=+m[1]||rnd(2,9),b2=rnd(1,30),x=rnd(1,12);
   var q=a+'x + '+b2+' = '+(a*x+b2);
   document.getElementById('mIn').value=q;solveMath();return;
 }
 // percentage: "20% of 840"
 if((m=t.match(/^([\d.]+)%\s*(?:of)?\s*([\d.]+)$/))||(m=t.match(/([\d.]+)%([\d.]+)/))){
   var p=rnd(1,9)*10,n=rnd(2,20)*10;
   document.getElementById('mIn').value=p+'% of '+n;solveMath();return;
 }
 // plain arithmetic "12*8+5"
 if(/[\d]/.test(t)&&/[+\-*]/.test(t)&&t.indexOf('=')<0&&t.indexOf(')')<0){
   var v1=rnd(4,15),v2=rnd(2,9),v3=rnd(2,20),op=['+','*'][rnd(0,1)];
   var q=v1+' '+op+' '+v2+' + '+v3;
   document.getElementById('mIn').value=q;solveMath();return;
 }
 // difference of two squares "(6y + x)(6y - x)"
 if(t.indexOf(')(')>-1){
   var A=rnd(2,9),B=rnd(1,9);
   document.getElementById('mIn').value='('+A+'y + '+B+'x)('+A+'y - '+B+'x)';solveMath();return;
 }
 // quadratic x^2+bx+c=0
 if((m=t.match(/x\s*\^\s*2\s*([+-][\d.]+)x\s*([+-][\d.]+)\s*=\s*0/))){
   var p=rnd(1,9),qq=rnd(1,9);
   var b3=p+qq,c3=p*qq;
   document.getElementById('mIn').value='x^2 + '+b3+'x + '+c3+' = 0';solveMath();return;
 }
 document.getElementById('mIn').value=LAST_INPUT;solveMath();
}

// ---- camera scan (OCR) ----
function scanStatus(t){var el=document.getElementById('scanStatus');if(t){el.style.display='block';el.textContent=t;}else{el.style.display='none';}}
function cleanOcr(t){
  return t.replace(/\u00d7|\u2715|\u2217/g,'*').replace(/\u00f7|\u2044/g,'/').replace(/\u2212|\u2013|\u2014/g,'-')
   .replace(/[Oo](?=\d)/g,'0').replace(/(?<=\d)[Oo]/g,'0')
   .replace(/[^0-9a-zA-Z+\-*/=().^ %\s]/g,' ')
   .replace(/\s+/g,' ').trim();
}
function scanImage(inp){
  var f=inp.files&&inp.files[0]; if(!f)return;
  if(!window.Tesseract){scanStatus('OCR engine still loading, try again in a moment');return;}
  scanStatus('Reading image...');
  var reader=new FileReader();
  reader.onload=function(e){
    Tesseract.recognize(e.target.result,'eng',{logger:function(m){
      if(m.status==='recognizing text')scanStatus('Reading image... '+Math.round(m.progress*100)+'%');
    }}).then(function(r){
      var txt=cleanOcr(r.data.text||'');
      scanStatus('');
      if(!txt){scanStatus("couldn't read anything from that photo, try better lighting or a straight-on shot");return;}
      var lines=txt.split(/\n|(?=\u2022)/).map(function(x){return x.replace(/^[-\u2022\u2023\u25cf*]\s*/,'').trim();}).filter(function(x){return x.length>3;});
      if(lines.length>1){showPick(lines);return;}
      document.getElementById('mIn').value=txt;
      solveMath();
    }).catch(function(){scanStatus("scan failed, try again or type it in");});
  };
  reader.readAsDataURL(f);
  inp.value='';
}
